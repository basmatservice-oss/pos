plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildTag = System.getenv('GITHUB_SHA') ?: 'local'
def davinciRoot = rootProject.projectDir.parentFile
def generatedDavinciAssets = layout.buildDirectory.dir('generated/davinciAssets')

android {
    namespace 'com.basmatservice.davincipos'
    compileSdk 35
    packaging { jniLibs { useLegacyPackaging = false } }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.basmatservice.davincipos'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-kotlin-foundation-' + buildTag.take(7)
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_shared' } }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets', generatedDavinciAssets]
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

tasks.register('prepareDavinciWebAssets', Copy) {
    from(davinciRoot) {
        include 'schema.sql'
        include 'mobile.html'
    }
    from(davinciRoot) {
        include '*.js'
        include '*.css'
        into 'assets'
    }
    into generatedDavinciAssets
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareDavinciWebAssets') }
