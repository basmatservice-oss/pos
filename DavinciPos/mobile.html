<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <title>DavinciPos | الهاتف</title>
  <link rel="stylesheet" href="/assets/mobile.css">
</head>
<body class="mobile-app">
  <header class="mobile-header"><div><span class="mobile-kicker">DAVINCIPOS</span><h1>مساحة العمل</h1></div><button class="profile-button" data-logout aria-label="تسجيل الخروج">خروج</button></header>
  <main id="mobile-view">
    <section class="mobile-welcome"><div><span>لوحة المتابعة</span><h2>أهلاً بك</h2><p>إدارة عملياتك من مكان واحد</p></div><div class="mobile-orb">D</div></section>
    <section class="mobile-stats"><article><span>المنتجات</span><strong id="mobile-products">—</strong></article><article><span>المبيعات</span><strong id="mobile-sales">—</strong></article></section>
    <section class="mobile-section"><div class="section-heading"><h3>الوصول السريع</h3><span>الوحدات</span></div><div class="mobile-actions"><button data-view="sales"><i>＋</i><b>بيع جديد</b><small>تسجيل فاتورة</small></button><button data-view="inventory"><i>▦</i><b>المخزون</b><small>الأصناف والكميات</small></button><button data-view="customers"><i>♙</i><b>العملاء</b><small>ملفات العملاء</small></button><button data-view="products"><i>▣</i><b>المنتجات</b><small>الأصناف والأسعار</small></button><button data-view="services"><i>▧</i><b>الخدمات</b><small>خدمات المتجر وتكاليفها</small></button><button data-view="currency"><i>$</i><b>سعر الصرف</b><small>الدولار والجنيه</small></button><button data-view="expenses"><i>−</i><b>المصروفات</b><small>تسجيل مصروفات المتجر</small></button><button data-view="suppliers"><i>▤</i><b>الموردون</b><small>ملفات الموردين</small></button><button data-view="purchases"><i>⇩</i><b>المشتريات</b><small>استلام فاتورة</small></button><button data-view="invoices-sales"><i>▤</i><b>فواتير المبيعات</b><small>سجل الفواتير والمرتجعات</small></button><button data-view="invoices-purchases"><i>▤</i><b>فواتير المشتريات</b><small>سجل مشتريات الموردين</small></button><button data-view="returns"><i>↩</i><b>المرتجعات</b><small>إرجاع المبيعات والمشتريات</small></button><button data-view="reports"><i>▤</i><b>التقارير</b><small>ملخص الأداء</small></button></div></section>
    <section class="mobile-section mobile-status"><div><span class="status-pulse"></span><b>حالة قاعدة البيانات</b></div><small>متصلة بالخادم المحلي</small></section>
  </main>
  <nav class="bottom-nav"><button class="selected" data-view="dashboard"><span>⌂</span>الرئيسية</button><button data-view="sales"><span>＋</span>المبيعات</button><button data-view="inventory"><span>▦</span>المخزون</button><button data-view="settings"><span>⚙</span>الإعدادات</button><button data-view="users"><span>♙</span>المستخدمون</button><button data-view="conflicts"><span>!</span>التعارضات</button></nav>
  <script type="module" src="/assets/mobile.js"></script>
</body>
</html>
