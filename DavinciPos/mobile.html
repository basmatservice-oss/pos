<!doctype html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <title>DavinciPos | الهاتف</title>

<body class="mobile-app">
  <header class="mobile-header"><div><span class="mobile-kicker">DAVINCIPOS</span><h1>مساحة العمل</h1></div><button class="profile-button" aria-label="الملف الشخصي">م</button></header>
  <main id="mobile-view">
    <section class="mobile-welcome"><div><span>لوحة المتابعة</span><h2>أهلاً بك</h2><p>إدارة عملياتك من مكان واحد</p></div><div class="mobile-orb">D</div></section>

  </main>
  <nav class="bottom-nav"><button class="selected" data-view="dashboard"><span>⌂</span>الرئيسية</button><button data-view="sales"><span>＋</span>المبيعات</button><button data-view="inventory"><span>▦</span>المخزون</button><button data-view="settings"><span>⚙</span>الإعدادات</button><button data-view="users"><span>♙</span>المستخدمون</button></nav>
