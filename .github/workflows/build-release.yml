name: Build Smart POS Android and Windows Packages

# Build final packages automatically whenever the packaging branch changes.
# Manual dispatch remains available for an explicit rebuild.
on:
  push:
    branches:
      - "packaging/capacitor-electron22-win7-android8"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android 8-16 APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund

      - name: Build native SQLite renderer without Dexie
        run: npm run build:native

      - name: Verify Android renderer excludes Dexie
        run: npm run test:native-bundle

      - name: Add and configure Capacitor Android project
        shell: bash
        run: |
          npx cap add android
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const gradleFile = 'android/variables.gradle';
          let gradle = fs.readFileSync(gradleFile, 'utf8');
          const settings = [['minSdkVersion', 26], ['compileSdkVersion', 36], ['targetSdkVersion', 36]];
          for (const [key, value] of settings) {
            const pattern = new RegExp(key + '\\s*=\\s*\\d+');
            if (!pattern.test(gradle)) throw new Error('Capacitor Android Gradle setting not found: ' + key);
            gradle = gradle.replace(pattern, key + ' = ' + value);
          }
          fs.writeFileSync(gradleFile, gradle);

          const rootGradleFile = 'android/build.gradle';
          let rootGradle = fs.readFileSync(rootGradleFile, 'utf8');
          const agpPattern = /com\.android\.tools\.build:gradle:[0-9.]+/;
          if (!agpPattern.test(rootGradle)) throw new Error('Android Gradle Plugin declaration not found');
          rootGradle = rootGradle.replace(agpPattern, 'com.android.tools.build:gradle:8.9.1');
          if (!rootGradle.includes('kotlin-gradle-plugin')) {
            const dependenciesBlock = /dependencies\s*\{/;
            if (!dependenciesBlock.test(rootGradle)) throw new Error('Gradle buildscript dependencies block not found for Kotlin plugin');
            rootGradle = rootGradle.replace(dependenciesBlock, match => match + "\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'");
          }
          fs.writeFileSync(rootGradleFile, rootGradle);

          const appGradleFile = 'android/app/build.gradle';
          let appGradle = fs.readFileSync(appGradleFile, 'utf8');
          if (!appGradle.includes("org.jetbrains.kotlin.android") && !appGradle.includes("kotlin-android")) {
            appGradle += "\napply plugin: 'org.jetbrains.kotlin.android'\n";
          }
          fs.writeFileSync(appGradleFile, appGradle);

          const manifestFile = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestFile, 'utf8');
          if (!manifest.includes('android:usesCleartextTraffic=')) {
            manifest = manifest.replace('<application', '<application android:usesCleartextTraffic="true"');
          }
          // Camera is requested only when the barcode/QR scanner is opened.
          // File/image pickers use Android's system picker and do not need broad
          // storage permissions on modern Android versions.
          if (!manifest.includes('android.permission.CAMERA')) {
            manifest = manifest.replace(
              '<application',
              '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application'
            );
          }
          fs.writeFileSync(manifestFile, manifest);
          NODE
          mkdir -p android/app/src/main/java/com/smartpos/studio
          find android/app/src/main/java -name 'MainActivity.java' -delete
          cp native/android/PosLocalDatabasePlugin.kt android/app/src/main/java/com/smartpos/studio/
          cp native/android/PosCameraPermissionPlugin.kt android/app/src/main/java/com/smartpos/studio/
          cp native/android/MainActivity.kt android/app/src/main/java/com/smartpos/studio/
          npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Create two identical APK deliverables
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/SmartPOS-Android-1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/SmartPOS-Android-2.apk
          APK1_SHA=$(sha256sum artifacts/SmartPOS-Android-1.apk | cut -d ' ' -f 1)
          APK2_SHA=$(sha256sum artifacts/SmartPOS-Android-2.apk | cut -d ' ' -f 1)
          echo "Android APK 1 SHA256: $APK1_SHA"
          echo "Android APK 2 SHA256: $APK2_SHA"
          test "$APK1_SHA" = "$APK2_SHA"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: smartpos-android-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows 7-11 x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python for native module rebuild
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund

      - name: Rebuild native modules for Electron 22.3.27
        env:
          GYP_DEFINES: openssl_fips=
        run: npx electron-builder install-app-deps

      - name: Build Windows x64 NSIS installer
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: smartpos-windows-x64-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
