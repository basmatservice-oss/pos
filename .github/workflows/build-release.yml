name: Build Smart POS Android and Windows Packages

on:
  push:
    branches:
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android 8-16 APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund

      - name: Build React web assets
        run: npm run build

      - name: Add and configure Capacitor Android project
        shell: bash
        run: |
          npx cap add android
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const gradleFile = 'android/variables.gradle';
          let gradle = fs.readFileSync(gradleFile, 'utf8');
          const settings = [['minSdkVersion', 26], ['compileSdkVersion', 36], ['targetSdkVersion', 36]];
          for (const [key, value] of settings) {
            const pattern = new RegExp(key + '\\s*=\\s*\\d+');
            if (!pattern.test(gradle)) throw new Error('Capacitor Android Gradle setting not found: ' + key);
            gradle = gradle.replace(pattern, key + ' = ' + value);
          }
          fs.writeFileSync(gradleFile, gradle);

          const rootGradleFile = 'android/build.gradle';
          let rootGradle = fs.readFileSync(rootGradleFile, 'utf8');
          const agpPattern = /com\.android\.tools\.build:gradle:[0-9.]+/;
          if (!agpPattern.test(rootGradle)) throw new Error('Android Gradle Plugin declaration not found');
          rootGradle = rootGradle.replace(agpPattern, 'com.android.tools.build:gradle:8.9.1');
          fs.writeFileSync(rootGradleFile, rootGradle);

          const manifestFile = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestFile, 'utf8');
          if (!manifest.includes('android:usesCleartextTraffic=')) {
            manifest = manifest.replace('<application', '<application android:usesCleartextTraffic="true"');
          }
          fs.writeFileSync(manifestFile, manifest);
          NODE
          mkdir -p android/app/src/main/java/com/smartpos/studio
          find android/app/src/main/java -name 'MainActivity.java' -delete
          cp native/android/PosLocalDatabasePlugin.kt android/app/src/main/java/com/smartpos/studio/
          cp native/android/MainActivity.kt android/app/src/main/java/com/smartpos/studio/
          npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Create two identical APK deliverables
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/SmartPOS-Android-1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/SmartPOS-Android-2.apk
          sha256sum artifacts/*.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: smartpos-android-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows 7-11 x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund

      - name: Build React frontend
        run: npm run build

      - name: Build Express backend for Electron's Node runtime
        run: npm run build:server

      - name: Rebuild native modules for Electron 22.3.27
        run: npx electron-builder install-app-deps

      - name: Build Windows x64 NSIS installer
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: smartpos-windows-x64-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
