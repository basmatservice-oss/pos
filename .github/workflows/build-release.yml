name: Build Smart POS (Windows 7+ EXE and Android APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      publish:
        description: 'Publish a GitHub Release (false = only build downloadable artifacts)'
        type: boolean
        default: false

jobs:
  build-android:
    name: Android APK (Android 8 to 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create and patch Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smart-pos-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smart-pos-android
          path: smart-pos-android.apk
          if-no-files-found: error

  build-windows:
    name: Windows x64 installer (Windows 7 SP1 and later)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (native modules are rebuilt for Electron 22)
        run: npm install --no-audit --no-fund

      - name: Build web app and server bundle
        run: |
          npm run build
          npm run build:server

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: smart-pos-windows
          path: release/*.exe
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Smart POS ${{ steps.tag.outputs.tag_name }}
          body: |
            - Windows x64 installer (.exe): can run as server or client (Windows 7 SP1 and later).
            - Android APK: Android 8.0 to 16, works as a client of the Windows server over Wi-Fi/LAN.
          files: |
            smart-pos-android/smart-pos-android.apk
            smart-pos-windows/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
