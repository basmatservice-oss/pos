name: Remove incomplete DavinciPos RC artifacts

on:
  push:
    branches:
      - feature/davincipos-android-standalone
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  remove-incomplete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the incomplete Android and Windows RC artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact_id in 14175118888 14175368830; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Deleted artifact ${artifact_id}"
            else
              echo "Artifact ${artifact_id} is already absent"
            fi
          done
