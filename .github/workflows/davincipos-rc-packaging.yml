name: DavinciPos RC packaging

on:
  push:
    branches:
      - build/davincipos-packaging-rc1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DavinciPos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify application
        run: |
          npm run check
          npm test
      - name: Build Windows installer
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: DavinciPos-Windows-EXE-RC1
          path: DavinciPos/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Android APK
        run: gradle --no-daemon -p DavinciPos/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DavinciPos-Android-APK-RC1
          path: DavinciPos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
