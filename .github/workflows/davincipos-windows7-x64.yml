name: DavinciPos Windows 7 x64 legacy build

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'DavinciPos/**'
      - '.github/workflows/davincipos-windows7-x64.yml'

permissions:
  contents: read

concurrency:
  group: davincipos-windows7-x64
  cancel-in-progress: true

jobs:
  build-win7-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: DavinciPos
    steps:
      - uses: actions/checkout@v4
      - name: Set up legacy-compatible build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: Verify isolated legacy toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          if ((node -p "process.versions.node.split('.')[0]") -ne "16") { throw "Expected Node.js 16 for the Win7 build." }
      - name: Build isolated Electron 22 x64 installer
        run: node scripts/build-win7-x64.cjs
      - name: Verify x64 application payload and installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/win7-x64/DavinciPos-Windows-7-x64-Setup-*.exe" -File
          if (-not $installer -or $installer.Count -ne 1) { throw "Expected exactly one Windows 7 x64 installer." }
          $payloadExe = Join-Path $env:TEMP "davincipos-win7-x64\dist-win7-x64\win-unpacked\DavinciPos.exe"
          if (-not (Test-Path $payloadExe)) { throw "Packaged Electron application payload was not found." }
          $stream = [System.IO.File]::OpenRead($payloadExe)
          try {
            $reader = New-Object System.IO.BinaryReader($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid application PE signature." }
            if ($reader.ReadUInt16() -ne 0x8664) { throw "Packaged application payload is not x64." }
          } finally { $stream.Dispose() }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: DavinciPos-Windows-7-x64-RC
          path: DavinciPos/dist/win7-x64/*.exe
          if-no-files-found: error
          retention-days: 14
