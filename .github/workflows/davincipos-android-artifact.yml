name: DavinciPos Android standalone artifact

on:
  push:
    branches:
      - feature/davincipos-android-standalone
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davincipos-android-artifact
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare embedded Node.js project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DavinciPos/android/app/src/main/assets/nodejs-project
          rsync -a DavinciPos/ DavinciPos/android/app/src/main/assets/nodejs-project/ \
            --exclude android --exclude node_modules --exclude dist --exclude release \
            --exclude desktop-shell --exclude '*.test.js' --exclude '*.sqlite*' \
            --exclude '.env' --exclude '.env.*' --exclude README.md
          cd DavinciPos/android/app/src/main/assets/nodejs-project
          npm install --omit=dev --ignore-scripts
      - name: Fetch Android Node.js runtime and SQLite native addons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/davincipos-node /tmp/sqlite-arm64 /tmp/sqlite-x64
          curl -fL --retry 3 -o /tmp/nodejs-mobile.zip \
            https://github.com/digidem/nodejs-mobile/releases/download/v24.20.0-0/nodejs-mobile-android-24.20.0-0.zip
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/davincipos-node
          curl -fL --retry 3 -o /tmp/sqlite-arm64.tar.gz \
            https://github.com/digidem/better-sqlite3-nodejs-mobile/releases/download/13.0.3/better-sqlite3-13.0.3-android-arm64.tar.gz
          tar -xzf /tmp/sqlite-arm64.tar.gz -C /tmp/sqlite-arm64
          curl -fL --retry 3 -o /tmp/sqlite-x64.tar.gz \
            https://github.com/digidem/better-sqlite3-nodejs-mobile/releases/download/13.0.3/better-sqlite3-13.0.3-android-x64.tar.gz
          tar -xzf /tmp/sqlite-x64.tar.gz -C /tmp/sqlite-x64
          APP=DavinciPos/android/app/src/main
          ASSETS="$APP/assets/nodejs-project"
          mkdir -p "$APP/jniLibs/arm64-v8a" "$APP/jniLibs/x86_64" "$APP/cpp/include/node" \
            "$ASSETS/native/arm64-v8a" "$ASSETS/native/x86_64"
          for ABI in arm64-v8a x86_64; do
            LIB="$(find /tmp/davincipos-node -path "*/$ABI/libnode.so" -print -quit)"
            test -n "$LIB"
            cp "$LIB" "$APP/jniLibs/$ABI/libnode.so"
          done
          HEADER="$(find /tmp/davincipos-node -path '*/include/node/node.h' -print -quit)"
          test -n "$HEADER"
          cp -a "$(dirname "$HEADER")/." "$APP/cpp/include/node/"
          ARM_ADDON="$(find /tmp/sqlite-arm64 -name better_sqlite3.node -print -quit)"
          X64_ADDON="$(find /tmp/sqlite-x64 -name better_sqlite3.node -print -quit)"
          test -n "$ARM_ADDON"
          test -n "$X64_ADDON"
          cp "$ARM_ADDON" "$ASSETS/native/arm64-v8a/better_sqlite3.node"
          cp "$X64_ADDON" "$ASSETS/native/x86_64/better_sqlite3.node"
      - name: Build Android APK
        run: gradle --no-daemon -p DavinciPos/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DavinciPos-Android-Standalone-RC
          path: DavinciPos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
