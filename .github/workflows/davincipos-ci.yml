name: DavinciPos CI
on:
  push:
    branches: [feature/davincipos-flat-rebuild]
    paths:
      - 'DavinciPos/**'
      - '.github/workflows/davincipos-ci.yml'
  pull_request:
    paths:
      - 'DavinciPos/**'
      - '.github/workflows/davincipos-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DavinciPos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: npm run check
      - run: npm test
