name: Unit tests and frontend validation

on:
  push:
    branches:
      - main
      - "dev/**"
      - "packaging/capacitor-electron22-win7-android8"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Rebuild SQLite test driver
        run: npm rebuild better-sqlite3
      - name: Run unit tests
        run: npm run test:unit
      - name: Verify additive inventory and currency migrations
        run: python3 tests/purchase_currency_migration_test.py
      - name: TypeScript validation
        run: npm run lint
      - name: Build browser frontend
        run: npm run build
      - name: Validate native SQLite frontend without Dexie
        run: npm run build:native
      - name: Verify native renderer contains no Dexie code
        run: npm run test:native-bundle
