name: Unit tests and frontend validation

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run unit tests
        run: npm run test:unit
      - name: Verify additive purchase currency migration
        run: python3 tests/purchase_currency_migration_test.py
      - name: TypeScript validation
        run: npm run lint
      - name: Build frontend
        run: npm run build
