name: DavinciPos standalone RC builds

on:
  push:
    branches:
      - feature/davincipos-android-standalone
      - fix/davincipos-android-startup-rc2
      - feature/davincipos-android-kotlin-sqlite
    paths:
      - 'DavinciPos/**'
      - '.github/workflows/davincipos-standalone-rc.yml'
  pull_request:
    branches:
      - feature/davincipos-android-standalone
    paths:
      - 'DavinciPos/**'
      - '.github/workflows/davincipos-standalone-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davincipos-standalone-rc
  cancel-in-progress: true

jobs:
  verify-and-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: DavinciPos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify supported Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major < 22) throw new Error('DavinciPos requires Node.js 22 or newer')"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify syntax and native SQLite binding
        run: |
          npm run check
          node --input-type=module -e "import Database from 'better-sqlite3'; const db = new Database(':memory:'); db.exec('CREATE TABLE smoke (id INTEGER PRIMARY KEY, value TEXT); INSERT INTO smoke(value) VALUES (\'sqlite-ok\')'); const row = db.prepare('SELECT value FROM smoke WHERE id=1').get(); if(row?.value !== 'sqlite-ok') throw new Error('SQLite native binding smoke test failed'); db.close(); console.log('better-sqlite3 native binding smoke test passed')"
      - name: Run complete test suite serially
        run: npm test -- --test-concurrency=1
      - name: Build Windows installer
        run: npm run package:win
      - name: Smoke-test the packaged Windows application and its private SQLite database
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/win-unpacked/DavinciPos.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:3187/api/health" -TimeoutSec 2
                if ($response.status -eq "ok" -and $response.database -eq "sqlite") {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "Packaged Windows backend did not become healthy." }
            Write-Host "Packaged Windows backend health check passed."
          } finally {
            taskkill /PID $process.Id /T /F 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DavinciPos-Windows-Standalone-RC
          path: DavinciPos/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare embedded Node.js project and production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DavinciPos/android/app/src/main/assets/nodejs-project
          rsync -a DavinciPos/ DavinciPos/android/app/src/main/assets/nodejs-project/ \
            --exclude android --exclude node_modules --exclude dist --exclude release \
            --exclude desktop-shell --exclude '*.test.js' --exclude '*.sqlite*' \
            --exclude '.env' --exclude '.env.*' --exclude README.md
          cd DavinciPos/android/app/src/main/assets/nodejs-project
          npm install --omit=dev --ignore-scripts
          mkdir -p node_modules/better-sqlite3/build/Release
      - name: Fetch pinned Android Node.js runtime and SQLite N-API addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/davincipos-node /tmp/sqlite-arm64 /tmp/sqlite-x64
          curl -fL --retry 3 -o /tmp/nodejs-mobile.zip \
            https://github.com/digidem/nodejs-mobile/releases/download/v24.20.0-0/nodejs-mobile-android-24.20.0-0.zip
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/davincipos-node
          curl -fL --retry 3 -o /tmp/sqlite-arm64.tar.gz \
            https://github.com/digidem/better-sqlite3-nodejs-mobile/releases/download/13.0.3/better-sqlite3-13.0.3-android-arm64.tar.gz
          tar -xzf /tmp/sqlite-arm64.tar.gz -C /tmp/sqlite-arm64
          curl -fL --retry 3 -o /tmp/sqlite-x64.tar.gz \
            https://github.com/digidem/better-sqlite3-nodejs-mobile/releases/download/13.0.3/better-sqlite3-13.0.3-android-x64.tar.gz
          tar -xzf /tmp/sqlite-x64.tar.gz -C /tmp/sqlite-x64
          APP=DavinciPos/android/app/src/main
          ASSETS="$APP/assets/nodejs-project"
          mkdir -p "$APP/jniLibs/arm64-v8a" "$APP/jniLibs/x86_64" "$APP/cpp/include/node" \
            "$ASSETS/native/arm64-v8a" "$ASSETS/native/x86_64"
          for ABI in arm64-v8a x86_64; do
            LIB="$(find /tmp/davincipos-node -path "*/$ABI/libnode.so" -print -quit)"
            test -n "$LIB"
            cp "$LIB" "$APP/jniLibs/$ABI/libnode.so"
          done
          HEADER="$(find /tmp/davincipos-node -path '*/include/node/node.h' -print -quit)"
          test -n "$HEADER"
          cp -a "$(dirname "$HEADER")/." "$APP/cpp/include/node/"
          ARM_ADDON="$(find /tmp/sqlite-arm64 -name better_sqlite3.node -print -quit)"
          X64_ADDON="$(find /tmp/sqlite-x64 -name better_sqlite3.node -print -quit)"
          test -n "$ARM_ADDON"
          test -n "$X64_ADDON"
          cp "$ARM_ADDON" "$ASSETS/native/arm64-v8a/better_sqlite3.node"
          cp "$X64_ADDON" "$ASSETS/native/x86_64/better_sqlite3.node"
          echo "Node runtime libraries:"
          find "$APP/jniLibs" -type f -printf '%p %s bytes\\n'
          echo "SQLite addon libraries:"
          find "$ASSETS/native" -type f -printf '%p %s bytes\\n'
      - name: Run Android JVM unit tests and build standalone APK
        run: gradle --no-daemon -p DavinciPos/android testDebugUnitTest assembleDebug
      - name: Verify native ELF 16 KB page compatibility and APK alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=DavinciPos/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/davincipos-apk-check
          unzip -oq "$APK" 'lib/*' -d /tmp/davincipos-apk-check
          while IFS= read -r -d '' LIB; do
            readelf -lW "$LIB" | python3 -c 'import sys; s=sys.stdin.read(); a=[int(line.split()[-1],16) for line in s.splitlines() if line.strip().startswith("LOAD ")]; assert a and min(a)>=16384, f"ELF LOAD alignment below 16 KB: {a}"'
          done < <(find /tmp/davincipos-apk-check/lib -name '*.so' -print0)
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
      # Emulator execution is intentionally omitted for this user-requested RC.
      # The APK is uploaded immediately after build and static/native alignment checks.
      - uses: actions/upload-artifact@v4
        with:
          name: DavinciPos-Android-Standalone-RC
          path: DavinciPos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
